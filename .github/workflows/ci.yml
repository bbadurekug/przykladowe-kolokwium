name: CI Pipeline

on:
    push:
        branches:
            [ master ]
    pull_request:
        branches:
            [ master ]

env:
    NODE_VERSION: '22'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: ${{ env.NODE_VERSION }}
                cache: 'npm'
                cache-dependency-path: ./package-lock.json

          - name: Install dependencies
            run: npm ci
        
          - name: Run linter
            run: npm run lint

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: lint

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: ${{ env.NODE_VERSION }}
                cache: 'npm'
                cache-dependency-path: ./package-lock.json

          - name: Install dependencies
            run: npm ci
        
          - name: Run test
            run: npm run test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: ${{ env.NODE_VERSION }}
                cache: 'npm'
                cache-dependency-path: ./package-lock.json

          - name: Install dependencies
            run: npm ci
        
          - name: Build application
            run: npm run build